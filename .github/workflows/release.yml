# vX.Y.Z のタグを push すると、5 つの target のバイナリを作り、GitHub Release に載せます。
# そのあと、大きい版のタグ（v1 など）を、その版のコミットへ動かします（uses: RustSecJP/check@v1 のため）。
# 使うのは GitHub の runner と GITHUB_TOKEN だけです（ほかのサービスや secrets は使いません）。
#
# 載せるもの（名前に版番号を入れないので、releases/latest/download/<名前> で取れます）:
#   rustsecjp-check-<os>-<arch>.tar.gz（Windows は .zip）… バイナリ、README.md、README.ja.md、LICENSE-*
#     linux-x86_64 / linux-aarch64 / macos-x86_64 / macos-aarch64 / windows-x86_64
#   SHA256SUMS                                           … すべての sha256（action.yml が確かめます）
name: Release

on:
  push:
    # v1 のような動かすタグでは動かしません
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: true
      matrix:
        include:
          # Linux は古めの glibc（Ubuntu 22.04 の 2.35）でビルドして、動く範囲を広げます
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04, name: linux-x86_64 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm, name: linux-aarch64 }
          # x86_64 の macOS は、arm64 の runner からクロスビルドします
          - { target: x86_64-apple-darwin, os: macos-latest, name: macos-x86_64 }
          - { target: aarch64-apple-darwin, os: macos-latest, name: macos-aarch64 }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, name: windows-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: The tag must match the version in Cargo.toml
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::タグ $GITHUB_REF_NAME と Cargo.toml の版 $version が違います"
            exit 1
          fi

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --target "${{ matrix.target }}"
          rustup default stable

      - name: Build
        shell: bash
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - name: Smoke test
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          "target/${{ matrix.target }}/release/rustsecjp-check" --version
          "target/${{ matrix.target }}/release/rustsecjp-check" --no-osv --no-incidents \
            --lockfile tests/fixtures/lockfiles/typosquat/Cargo.lock --fail-on never > /dev/null

      - name: Package
        shell: bash
        run: |
          name="rustsecjp-check-${{ matrix.name }}"
          docs=(README.md README.ja.md LICENSE-MIT LICENSE-APACHE)
          mkdir -p dist stage
          cp "${docs[@]}" stage/
          if [ "$RUNNER_OS" = Windows ]; then
            cp "target/${{ matrix.target }}/release/rustsecjp-check.exe" stage/
            (cd stage && 7z a -tzip "../dist/$name.zip" rustsecjp-check.exe "${docs[@]}")
          else
            cp "target/${{ matrix.target }}/release/rustsecjp-check" stage/
            tar -C stage -czf "dist/$name.tar.gz" rustsecjp-check "${docs[@]}"
          fi
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # Release を作るため
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            flags=()
            case "$TAG" in *-*) flags+=(--prerelease) ;; esac
            gh release create "$TAG" dist/* --verify-tag --title "$TAG" --generate-notes "${flags[@]}"
          fi

      # 正式な版（-rc などが付かない版）なら、大きい版のタグ（v1 など）をこのコミットへ動かします
      - name: Move the major tag
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          major="${TAG%%.*}"
          sha=$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)
          if gh api "repos/$GH_REPO/git/ref/tags/$major" > /dev/null 2>&1; then
            ok=$(gh api -X PATCH "repos/$GH_REPO/git/refs/tags/$major" -f sha="$sha" -F force=true > /dev/null && echo yes || true)
          else
            ok=$(gh api -X POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$major" -f sha="$sha" > /dev/null && echo yes || true)
          fi
          # GITHUB_TOKEN では動かせないことがあります（ワークフローのファイルが変わったコミットなど）。
          # そのときは手で動かします: git tag -f v1 vX.Y.Z && git push -f origin v1
          if [ "$ok" = yes ]; then echo "$major → $sha"; else echo "::warning::$major を動かせませんでした。手で動かしてください"; fi
